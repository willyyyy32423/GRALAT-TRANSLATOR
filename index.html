<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gralat - Traduttore Classico</title>
    <link rel="icon" type="image/png" href="icona.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div class="container">
        <button id="themeToggle" class="theme-toggle" onclick="cambiaTema()" title="Cambia Tema">🌙</button>

        <h1>Gralat</h1>
        <p class="subtitle">Il tuo dizionario universale per le lingue classiche</p>

        <div class="direction-container">
            <button class="icon-btn direction-toggle" onclick="invertiDirezione()" id="btnDirezione" title="Inverti direzione di traduzione">
                🇮🇹 Italiano ➔ 🏛️ Antico
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:8px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
            </button>
        </div>

        <textarea id="inputText" placeholder="Scrivi qui la frase in italiano..."></textarea>

        <div class="buttons">
            <button class="action-btn" id="btnLatino" onclick="eseguiTraduzione('la')">Traduci in Latino</button>
            <button class="action-btn" id="btnGreco" onclick="eseguiTraduzione('el')">Traduci in Greco</button>
        </div>

        <div class="output-container">
            <div class="output-box">
                <span id="outputText" class="placeholder-text">La traduzione apparirà qui...</span>
            </div>
            
            <div class="extra-actions" id="extraActions" style="display: none;">
                <button class="icon-btn" onclick="copiaTesto()" title="Copia negli appunti">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copia
                </button>

                <button class="icon-btn" onclick="ascoltaTesto()" title="Ascolta la pronuncia">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l5 5V3l-5 5H7a2 2 0 00-2 2z"></path></svg>
                    Ascolta
                </button>

                <button class="icon-btn" onclick="condividiSito()" title="Condividi">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    Condividi
                </button>
            </div>
        </div>

        <div class="history-container">
            <h3>Archivio Recente</h3>
            <ul id="historyList" class="history-list"></ul>
        </div>

        <p class="disclaimer">
            * Traduzioni generate automaticamente dal motore neurale.
        </p>
    </div>

    <script src="script.js?v=5.0"></script>
</body>
</html>
